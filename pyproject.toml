[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lab-research-agent"
version = "0.1.0"
description = "Evidence-grounded literature assistant built with PaperQA and hybrid retrieval"
requires-python = ">=3.11,<3.14"
dependencies = [
  "paper-qa==5.29.1", "litellm==1.83.9", "pypdf>=5,<7", "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1", "python-multipart>=0.0.20,<1",
  "pydantic-settings>=2.10,<3", "langgraph>=0.3,<2",
  "faiss-cpu>=1.10,<2", "rank-bm25==0.2.2", "httpx>=0.28,<1",
  "jieba==0.42.1", "mcp>=1.30,<2", "filelock>=3.10,<5"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "reportlab>=4,<5"]
local = ["sentence-transformers>=3,<6"]

[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
researchagent = ["static/*.html"]
[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
