<!doctype html>
<html lang="zh-CN">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ResearchAgent · 科研文献助手</title>
<style>
:root{font-family:Inter,"Microsoft YaHei",sans-serif;color:#203047;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}header{background:#173c5b;color:white;padding:28px 5vw}header h1{margin:0 0 8px;font-size:27px}header p{margin:0;color:#c7dbe9;font-size:14px}main{max-width:1200px;margin:25px auto;padding:0 20px;display:grid;grid-template-columns:290px 1fr;gap:24px}.panel{background:white;border:1px solid #dce4ee;border-radius:14px;padding:22px}h2{font-size:18px;margin:0 0 17px}.muted{color:#67798c;font-size:13px;line-height:1.7}button{cursor:pointer;background:#245a81;border:0;border-radius:7px;color:white;padding:11px 18px;font:inherit}button:disabled{opacity:.5;cursor:wait}button.secondary{background:#edf3f8;color:#245a81}input[type=file]{max-width:100%;font-size:12px;margin-bottom:14px}textarea{width:100%;min-height:105px;border:1px solid #cbd7e3;border-radius:8px;padding:13px;font:inherit;resize:vertical}.row{display:flex;align-items:center;gap:12px;justify-content:space-between;margin:13px 0}label{font-size:13px}.doc{padding:12px 0;border-bottom:1px solid #edf0f4;overflow-wrap:anywhere}.answer{white-space:pre-wrap;line-height:1.9;margin:20px 0}.source{border:1px solid #dce4ee;border-left:3px solid #245a81;border-radius:6px;padding:14px;margin-top:12px}.source p{white-space:pre-wrap;line-height:1.7;font-size:13px;max-height:160px;overflow:auto}a{color:#245a81}.status{min-height:24px;color:#556b7e;font-size:13px;margin-top:12px}.error{color:#a12b39}.badge{display:inline-block;background:#eaf3f6;color:#245a81;padding:4px 8px;border-radius:4px;font-size:12px}@media(max-width:750px){main{grid-template-columns:1fr}header{padding:23px} .panel{padding:18px}}
</style>
<header><h1>ResearchAgent</h1><p>科研文献助手 · 检索论文，核查结论，回到原文</p></header>
<main><aside class="panel"><h2>我的文献</h2><p class="muted">上传可提取文字的 PDF。扫描件请先完成 OCR。</p><input id="file" type="file" accept="application/pdf"><button id="upload">上传文献</button><div id="uploadStatus" class="status" role="status"></div><div id="documents"></div><p class="muted">问答使用当前文献库。引用显示 PDF 文件页序，可能与书页印刷编号不同。</p><a href="/docs">查看 API 文档</a></aside>
<section class="panel"><div class="row"><h2>围绕研究问题提问</h2><button class="secondary" id="reset">新建会话</button></div><textarea id="question" placeholder="例如：这些论文如何融合可见光与热红外特征？"></textarea><div class="row"><label><input type="checkbox" id="external"> 本地未命中时允许外部论文检索</label><button id="ask">查找证据并回答</button></div><p class="muted">回答附带证据片段和来源，请结合原文核查。模型及外部检索服务需在本机配置。</p><div id="status" class="status" role="status"></div><div id="answer" class="answer"></div><div id="sources"></div></section></main>
<script>
let sessionId=null;const $=id=>document.getElementById(id);
async function api(url,options){const r=await fetch(url,options);const data=await r.json();if(!r.ok)throw Error(typeof data.detail==='string'?data.detail:'请求失败，请检查输入。');return data;}
function status(id,text,error=false){$(id).textContent=text;$(id).className='status'+(error?' error':'');}
async function documents(){const docs=await api('/documents');$('documents').replaceChildren();for(const d of docs){const div=document.createElement('div');div.className='doc';div.textContent=d.filename;const meta=document.createElement('div');meta.className='muted';meta.textContent=`${d.pages} 页 · ${d.chunks} 个证据片段`;div.append(meta);$('documents').append(div);}}
$('upload').onclick=async()=>{const file=$('file').files[0];if(!file)return status('uploadStatus','请先选择 PDF。',true);$('upload').disabled=true;status('uploadStatus','正在解析文献…');try{const form=new FormData();form.append('file',file);await api('/documents',{method:'POST',body:form});status('uploadStatus','文献已入库。');await documents();}catch(e){status('uploadStatus',e.message,true);}finally{$('upload').disabled=false;}};
$('reset').onclick=()=>{sessionId=null;$('answer').textContent='';$('sources').replaceChildren();status('status','已新建会话。');};
$('ask').onclick=async()=>{const question=$('question').value.trim();if(!question)return status('status','请输入研究问题。',true);$('ask').disabled=true;status('status','正在检索并核查文献证据…');$('answer').textContent='';$('sources').replaceChildren();try{const data=await api('/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question,session_id:sessionId,external:$('external').checked})});sessionId=data.session_id;$('answer').textContent=data.answer;status('status',data.refused?'证据不足，请调整问题或补充文献。':`找到 ${data.citations.length} 条引用。`);if(data.warnings.length)status('status',data.warnings.join(' '),true);data.citations.forEach((c,i)=>{const box=document.createElement('div');box.className='source';const a=document.createElement('a');a.textContent=`[${i+1}] ${c.filename} · ${c.page?'PDF 第 '+c.page+' 页':'外部来源'}`;a.href=c.url&&/^https?:\/\//.test(c.url)?c.url:`/documents/${encodeURIComponent(c.document_id)}/source?page=${c.page}#page=${c.page}`;a.target='_blank';a.rel='noopener noreferrer';const p=document.createElement('p');p.textContent=c.text;box.append(a,p);$('sources').append(box);});}catch(e){status('status',e.message,true);}finally{$('ask').disabled=false;}};
documents().catch(e=>status('uploadStatus',e.message,true));
</script></html>
